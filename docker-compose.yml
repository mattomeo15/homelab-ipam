version: '3.8'

services:
  ipam:
    build: .
    container_name: homelab-ipam
    restart: unless-stopped
    # Use host network so ping/ARP scanning can discover LAN devices
    network_mode: host
    environment:
      - TZ=America/New_York
      - PORT=8000
    volumes:
      - ./backend/data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3